<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadTrac Data</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f6f9; color: #222; }
    header { background: #0070d2; color: white; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    .tabs { display: flex; gap: 0; background: #005ab3; padding: 0 32px; }
    .tab { padding: 10px 22px; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: rgba(255,255,255,.7); border-bottom: 3px solid transparent; }
    .tab.active { color: white; border-bottom-color: white; }
    .container { max-width: 1060px; margin: 32px auto; padding: 0 16px; }
    .card { background: white; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); overflow: hidden; display: none; }
    .card.active { display: block; }
    .card-header { padding: 16px 20px; border-bottom: 1px solid #e5e5e5; display: flex; justify-content: space-between; align-items: center; }
    .card-header h2 { font-size: 1rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th { background: #f8f9fb; text-align: left; padding: 10px 12px; font-weight: 600; color: #555; border-bottom: 1px solid #e5e5e5; }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8f9ff; }
    input.cell-input { border: 1px solid #0070d2; border-radius: 4px; padding: 5px 7px; width: 100%; font-size: 0.87rem; outline: none; }
    .badge { display: inline-block; background: #e8f4e8; color: #2e7d32; border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; font-weight: 600; }
    .btn { border: none; border-radius: 4px; padding: 6px 14px; font-size: 0.83rem; cursor: pointer; font-weight: 500; transition: opacity .15s; }
    .btn:hover { opacity: 0.85; }
    .btn-edit   { background: #e8f0fe; color: #1a73e8; }
    .btn-save   { background: #0070d2; color: white; }
    .btn-cancel { background: #f0f0f0; color: #555; margin-left: 4px; }
    .btn-delete { background: #fde8e8; color: #c0392b; margin-left: 4px; }
    .btn-add    { background: #0070d2; color: white; }
    .actions { display: flex; gap: 4px; white-space: nowrap; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #2e7d32; color: white; padding: 12px 20px; border-radius: 6px; font-size: 0.9rem; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .add-form { padding: 16px 20px; border-top: 2px dashed #e0e0e0; display: none; }
    .add-form h3 { font-size: 0.95rem; margin-bottom: 12px; color: #555; }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
    .form-row input { border: 1px solid #ccc; border-radius: 4px; padding: 7px 10px; font-size: 0.88rem; flex: 1 1 160px; }
    .form-row input:focus { border-color: #0070d2; outline: none; }
    .form-actions { display: flex; gap: 8px; }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
  <h1>LeadTrac Data</h1>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('files')">Files</div>
  <div class="tab" onclick="switchTab('accounts')">Accounts</div>
</div>

<div class="container">

  <!-- FILES TAB -->
  <div class="card active" id="tab-files">
    <div class="card-header">
      <h2>Files <span id="files-count" style="color:#888;font-weight:400"></span></h2>
      <button class="btn btn-add" onclick="toggleForm('files-form')">+ Add File</button>
    </div>
    <table>
      <thead><tr>
        <th>File ID</th><th>Name</th><th>Est. Debt Amount</th><th>First Draft Date</th><th>Weekly Payment</th><th>NSF Date</th><th>Escrow Balance</th><th>Actions</th>
      </tr></thead>
      <tbody id="files-tbody"></tbody>
    </table>
    <div class="add-form" id="files-form">
      <h3>New File</h3>
      <div class="form-row">
        <input id="nf-FileID"               placeholder="File ID (e.g. FILE-006)"/>
        <input id="nf-Name"                 placeholder="Name"/>
        <input id="nf-EstimatedDebtAmount"  placeholder="Est. Debt Amount" type="number" step="0.01"/>
        <input id="nf-FirstDraftDate"       placeholder="First Draft Date" type="date"/>
        <input id="nf-CurrentWeeklyPayment" placeholder="Weekly Payment" type="number" step="0.01"/>
        <input id="nf-NSFDate"              placeholder="NSF Date" type="date"/>
        <input id="nf-CurrentEscrowBalance" placeholder="Escrow Balance" type="number" step="0.01"/>
      </div>
      <div class="form-actions">
        <button class="btn btn-save" onclick="addFile()">Save</button>
        <button class="btn btn-cancel" onclick="toggleForm('files-form')">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ACCOUNTS TAB -->
  <div class="card" id="tab-accounts">
    <div class="card-header">
      <h2>Accounts <span id="accounts-count" style="color:#888;font-weight:400"></span></h2>
      <button class="btn btn-add" onclick="toggleForm('accounts-form')">+ Add Account</button>
    </div>
    <table>
      <thead><tr>
        <th>Account ID</th><th>Name</th><th>SSN</th><th>Driver's License</th><th>Actions</th>
      </tr></thead>
      <tbody id="accounts-tbody"></tbody>
    </table>
    <div class="add-form" id="accounts-form">
      <h3>New Account</h3>
      <div class="form-row">
        <input id="na-AccountID"      placeholder="Account ID (e.g. ACC-006)"/>
        <input id="na-Name"           placeholder="Name"/>
        <input id="na-SSN"            placeholder="SSN (e.g. XXX-XX-0000)"/>
        <input id="na-DriversLicense" placeholder="Driver's License"/>
      </div>
      <div class="form-actions">
        <button class="btn btn-save" onclick="addAccount()">Save</button>
        <button class="btn btn-cancel" onclick="toggleForm('accounts-form')">Cancel</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  let files = [], accounts = [];

  async function loadAll() {
    [files, accounts] = await Promise.all([
      fetch('/api/files').then(r => r.json()),
      fetch('/api/accounts').then(r => r.json())
    ]);
    renderFiles();
    renderAccounts();
  }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab[onclick="switchTab('${name}')"]`).classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');
  }

  function toggleForm(id) {
    const f = document.getElementById(id);
    f.style.display = f.style.display === 'block' ? 'none' : 'block';
  }

  // ── Files ─────────────────────────────────────────────────
  function renderFiles() {
    document.getElementById('files-count').textContent = `(${files.length})`;
    document.getElementById('files-tbody').innerHTML = files.map((f, i) => `
      <tr id="fr-${i}">
        <td><span class="badge">${esc(f.FileID)}</span></td>
        <td id="fc-Name-${i}">${esc(f.Name)}</td>
        <td id="fc-EstimatedDebtAmount-${i}">$${Number(f.EstimatedDebtAmount).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
        <td id="fc-FirstDraftDate-${i}">${formatDate(f.FirstDraftDate)}</td>
        <td id="fc-CurrentWeeklyPayment-${i}">$${Number(f.CurrentWeeklyPayment).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
        <td id="fc-NSFDate-${i}">${formatDate(f.NSFDate)}</td>
        <td id="fc-CurrentEscrowBalance-${i}">$${Number(f.CurrentEscrowBalance||0).toLocaleString('en-US',{minimumFractionDigits:2})}</td>
        <td><div class="actions">
          <button class="btn btn-edit" onclick="editFile(${i})">Edit</button>
          <button class="btn btn-delete" onclick="deleteFile(${i})">Delete</button>
        </div></td>
      </tr>`).join('');
  }

  function editFile(i) {
    const f = files[i];
    [['Name','text',f.Name],['EstimatedDebtAmount','number',f.EstimatedDebtAmount],['FirstDraftDate','date',f.FirstDraftDate?.slice(0,10)],['CurrentWeeklyPayment','number',f.CurrentWeeklyPayment],['NSFDate','date',f.NSFDate?.slice(0,10)],['CurrentEscrowBalance','number',f.CurrentEscrowBalance]].forEach(([field,type,val]) => {
      document.getElementById(`fc-${field}-${i}`).innerHTML =
        `<input class="cell-input" id="fi-${field}-${i}" type="${type}" ${type==='number'?'step="0.01"':''} value="${esc(String(val??''))}"/>`;
    });
    document.querySelector(`#fr-${i} .actions`).innerHTML = `
      <button class="btn btn-save" onclick="saveFile(${i})">Save</button>
      <button class="btn btn-cancel" onclick="renderFiles()">Cancel</button>`;
    document.getElementById(`fi-Name-${i}`).focus();
  }

  async function saveFile(i) {
    const id = files[i].FileID;
    const body = {
      Name:                 document.getElementById(`fi-Name-${i}`).value,
      EstimatedDebtAmount:  parseFloat(document.getElementById(`fi-EstimatedDebtAmount-${i}`).value),
      FirstDraftDate:       document.getElementById(`fi-FirstDraftDate-${i}`).value + 'T00:00:00',
      CurrentWeeklyPayment: parseFloat(document.getElementById(`fi-CurrentWeeklyPayment-${i}`).value),
      NSFDate:              (document.getElementById(`fi-NSFDate-${i}`).value||'') + (document.getElementById(`fi-NSFDate-${i}`).value ? 'T00:00:00' : ''),
      CurrentEscrowBalance: parseFloat(document.getElementById(`fi-CurrentEscrowBalance-${i}`).value)
    };
    const res = await fetch(`/api/files/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (res.ok) { files[i] = {...files[i],...body}; renderFiles(); toast('File updated'); }
    else toast('Error saving', true);
  }

  async function deleteFile(i) {
    if (!confirm(`Delete ${files[i].FileID}?`)) return;
    const res = await fetch(`/api/files/${files[i].FileID}`, { method:'DELETE' });
    if (res.ok) { files.splice(i,1); renderFiles(); toast('File deleted'); }
  }

  async function addFile() {
    const body = {
      FileID:               document.getElementById('nf-FileID').value.trim(),
      Name:                 document.getElementById('nf-Name').value.trim(),
      EstimatedDebtAmount:  parseFloat(document.getElementById('nf-EstimatedDebtAmount').value)||0,
      FirstDraftDate:       (document.getElementById('nf-FirstDraftDate').value||'')+'T00:00:00',
      CurrentWeeklyPayment: parseFloat(document.getElementById('nf-CurrentWeeklyPayment').value)||0,
      NSFDate:              document.getElementById('nf-NSFDate').value ? document.getElementById('nf-NSFDate').value+'T00:00:00' : '',
      CurrentEscrowBalance: parseFloat(document.getElementById('nf-CurrentEscrowBalance').value)||0
    };
    if (!body.FileID) { alert('File ID is required'); return; }
    const res = await fetch('/api/files', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (res.ok) { files.push(body); renderFiles(); toggleForm('files-form'); toast('File added'); }
    else toast('Error', true);
  }

  // ── Accounts ──────────────────────────────────────────────
  function renderAccounts() {
    document.getElementById('accounts-count').textContent = `(${accounts.length})`;
    document.getElementById('accounts-tbody').innerHTML = accounts.map((a, i) => `
      <tr id="ar-${i}">
        <td><span class="badge">${esc(a.AccountID)}</span></td>
        <td id="ac-Name-${i}">${esc(a.Name)}</td>
        <td id="ac-SSN-${i}">${esc(a.SSN)}</td>
        <td id="ac-DriversLicense-${i}">${esc(a.DriversLicense)}</td>
        <td><div class="actions">
          <button class="btn btn-edit" onclick="editAccount(${i})">Edit</button>
          <button class="btn btn-delete" onclick="deleteAccount(${i})">Delete</button>
        </div></td>
      </tr>`).join('');
  }

  function editAccount(i) {
    const a = accounts[i];
    ['Name','SSN','DriversLicense'].forEach(field => {
      document.getElementById(`ac-${field}-${i}`).innerHTML =
        `<input class="cell-input" id="ai-${field}-${i}" value="${esc(a[field]??'')}"/>`;
    });
    document.querySelector(`#ar-${i} .actions`).innerHTML = `
      <button class="btn btn-save" onclick="saveAccount(${i})">Save</button>
      <button class="btn btn-cancel" onclick="renderAccounts()">Cancel</button>`;
    document.getElementById(`ai-Name-${i}`).focus();
  }

  async function saveAccount(i) {
    const id = accounts[i].AccountID;
    const body = {};
    ['Name','SSN','DriversLicense'].forEach(f => { body[f] = document.getElementById(`ai-${f}-${i}`).value; });
    const res = await fetch(`/api/accounts/${id}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (res.ok) { accounts[i]={...accounts[i],...body}; renderAccounts(); toast('Account updated'); }
    else toast('Error saving', true);
  }

  async function deleteAccount(i) {
    if (!confirm(`Delete ${accounts[i].AccountID}?`)) return;
    const res = await fetch(`/api/accounts/${accounts[i].AccountID}`, { method:'DELETE' });
    if (res.ok) { accounts.splice(i,1); renderAccounts(); toast('Account deleted'); }
  }

  async function addAccount() {
    const body = {
      AccountID:      document.getElementById('na-AccountID').value.trim(),
      Name:           document.getElementById('na-Name').value.trim(),
      SSN:            document.getElementById('na-SSN').value.trim(),
      DriversLicense: document.getElementById('na-DriversLicense').value.trim()
    };
    if (!body.AccountID) { alert('Account ID is required'); return; }
    const res = await fetch('/api/accounts', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (res.ok) { accounts.push(body); renderAccounts(); toggleForm('accounts-form'); toast('Account added'); }
    else toast('Error', true);
  }

  function formatDate(d) {
    if (!d) return '';
    const dt = new Date(d);
    return isNaN(dt) ? d : dt.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  }

  function toast(msg, err) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = err ? '#c0392b' : '#2e7d32';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 3000);
  }

  function esc(s) {
    return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadAll();
</script>
</body>
</html>
